<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Familienradio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#f7f3eb;background:#263740;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:8px;background:#263740}
.panel{background:#263740;border:0;border-radius:14px;padding:9px 10px;max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
h1{font-size:25px;margin:0;font-weight:800;color:#fff9f0;letter-spacing:.1px}
small{font-size:12px;color:#c0d0d4}
.controls{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.station,.stop{min-height:60px;border:1px solid #667985;border-radius:12px;background:#334b59;color:#fffaf3;font-size:19px;font-weight:750;padding:10px 14px;cursor:pointer;flex:1;min-width:125px;touch-action:manipulation}
.station:nth-child(2){background:#435048;border-color:#607064}
.station:nth-child(3){background:#554a4b;border-color:#776367}
.station:active,.stop:active{transform:scale(.99)}
.station[aria-pressed="true"]{background:#51788c;border-color:#a8e1f7;color:#fff;box-shadow:inset 0 0 0 2px #7ecae8}
.stop{flex:0 0 auto;min-width:105px;background:#415b69;border-color:#7095a5}
.stop:focus-visible,.station:focus-visible{outline:3px solid #a8e1f7;outline-offset:2px}
footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.status{font-size:14px;color:#a8e1f7;flex:1;min-width:180px}
.volume{display:flex;gap:7px;align-items:center;font-size:14px;color:#e1e8e4}
input[type=range]{accent-color:#7ecae8;min-width:90px;width:125px}
@media(max-width:540px){body{padding:4px}.panel{padding:5px;border-radius:10px}h1{font-size:21px}.station,.stop{font-size:15px;min-height:51px;padding:7px;min-width:93px}.stop{min-width:73px}.controls{gap:5px}.volume{display:none}small{display:none}.status{font-size:12px;min-width:0}}
</style>
</head>
<body>
<section class="panel" aria-label="Familienradio">
<header><h1>Radio</h1><small>Sender auswählen</small></header>
<div class="controls" role="group" aria-label="Radiosender">
<button class="station" type="button" data-station="srf1" aria-pressed="false">▶ SRF 1</button>
<button class="station" type="button" data-station="srf3" aria-pressed="false">▶ SRF 3</button>
<button class="station" type="button" data-station="pilatus" aria-pressed="false">▶ Radio Pilatus</button>
<button class="stop" type="button" id="stop">■ Stopp</button>
</div>
<footer><span id="status" role="status" class="status">Bereit · Ton am Wanddisplay erforderlich</span><label class="volume">🔊 Lautstärke <input id="volume" type="range" min="0" max="100" value="70" aria-label="Lautstärke"></label></footer>
<audio id="radio" preload="none" playsinline></audio>
</section>
<script>
'use strict';
const streams={
 srf1:{name:'SRF 1',url:'https://stream.srg-ssr.ch/srgssr/srf1/mp3/128'},
 srf3:{name:'SRF 3',url:'https://stream.srg-ssr.ch/srgssr/srf3/mp3/128'},
 pilatus:{name:'Radio Pilatus',url:'https://stream.streambase.ch/radiopilatus/mp3-128/stream.streambase.ch/'}
};
const radio=document.querySelector('#radio');
const status=document.querySelector('#status');
const buttons=[...document.querySelectorAll('.station')];
radio.volume=.7;
function mark(key){buttons.forEach(button=>{let active=button.dataset.station===key;button.setAttribute('aria-pressed',String(active));button.textContent=(active?'❚❚ ':'▶ ')+streams[button.dataset.station].name})}
function stop(){radio.pause();radio.removeAttribute('src');radio.load();mark(null);status.textContent='Radio gestoppt'}
for(const btn of buttons){btn.addEventListener('click',async()=>{
 const key=btn.dataset.station;
 if(btn.getAttribute('aria-pressed')==='true'&&!radio.paused){stop();return}
 radio.pause();radio.src=streams[key].url;radio.load();mark(key);status.textContent='Verbinde mit '+streams[key].name+' …';
 try{await radio.play();status.textContent='Live: '+streams[key].name}
 catch(err){mark(null);status.textContent='Wiedergabe nicht möglich. Internet, Ton und Stream prüfen.'}
})}
document.querySelector('#stop').addEventListener('click',stop);
document.querySelector('#volume').addEventListener('input',ev=>{radio.volume=Number(ev.target.value)/100});
radio.addEventListener('error',()=>{if(radio.src){mark(null);status.textContent='Stream nicht erreichbar. Anderen Sender ausprobieren.'}});
window.addEventListener('pagehide',()=>radio.pause());
</script>
</body>
</html>
