<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familien-Countdown</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;padding:5px}.panel{background:#211917;border:1px solid #654236;border-radius:12px;overflow:hidden;max-width:750px;margin:auto}.header{background:linear-gradient(#974122,#6e2e19);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:17px;margin:0}.edit,.action,.manage button{color:#fff;cursor:pointer;border-radius:7px;border:1px solid #a77b63;padding:8px 10px;background:#79412d;font-size:13px}.entries{padding:5px 10px}.entry{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #674539}.entry:last-child{border:0}.emoji{font-size:21px}.days{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}.muted{color:#e0c7b9;font-size:12px;padding:7px 12px}.modal{padding:12px;background:#35251f;border-top:1px solid #805743}form{display:grid;grid-template-columns:minmax(120px,2fr) minmax(130px,1fr) minmax(140px,1fr) minmax(90px,1fr) auto;gap:8px;align-items:end}label{font-size:12px;color:#ead6cb;display:flex;flex-direction:column;gap:4px}input,select{width:100%;border:1px solid #a77b63;border-radius:6px;background:#fff;color:#222;min-height:38px;padding:7px;font-size:14px}.action{min-height:38px;background:#a84e2e;font-weight:750}.manage{margin-top:10px}.manage-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #604033;padding:6px 0;font-size:13px}.manage-row button{margin-left:5px;padding:5px 7px}[hidden]{display:none!important}@media(max-width:690px){form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.action{grid-column:1/-1}}
</style></head><body>
<section class="panel"><header class="header"><h1>📅 Noch so viele Tage …</h1><button id="toggle" class="edit" type="button">✎ Bearbeiten</button></header>
<div id="entries" class="entries"></div><div class="muted" id="hint"></div><div class="muted" role="status" id="feedback"></div>
<section id="editor" class="modal" hidden><form id="form">
<label class="wide">Ereignis<input id="name" maxlength="60" required placeholder="z. B. Sommerferien"></label>
<label>Datum<input type="date" id="date" required></label>
<label>Symbol (19 Möglichkeiten)<select id="emoji">
<option value="🐰">🐰 Osterhase</option><option value="🎂">🎂 Geburtstagstorte</option><option value="🎹">🎹 Klaviertastatur</option><option value="🎻">🎻 Cello</option><option value="🌷">🌷 Tulpe</option><option value="🏖️">🏖️ Strand</option><option value="✈️">✈️ Flugzeug</option><option value="🎄">🎄 Weihnachten</option><option value="🎅">🎅 Samichlaus</option><option value="🚗">🚗 Auto</option><option value="🧳">🧳 Koffer</option><option value="📚">📚 Bücher</option><option value="✨">✨ Silvester</option><option value="🍂">🍂 Herbstlaub</option><option value="🍁">🍁 Herbstblatt</option><option value="🍂🍁">🍂🍁 Herbstferien</option><option value="⛷️">⛷️ Skiferien</option><option value="🎉" selected>🎉 Feiern</option><option value="custom">✏️ Eigenes Emoji …</option></select></label>
<label id="customEmojiLabel" hidden>Eigenes Symbol<input id="customEmoji" maxlength="12" placeholder="Emoji"></label>
<label>Wiederholen<select id="repeat"><option value="once">Einmalig</option><option value="yearly">Jährlich</option></select></label>
<button class="action" type="submit">Hinzufügen</button></form><div class="manage" id="manage"></div></section></section>
<script>
'use strict';
const KEY='familien-countdown-v1';
const defaults=[{id:'xmas',name:'Weihnachten',date:'2026-12-24',emoji:'🎄',repeat:'yearly'},{id:'ny',name:'Silvester',date:'2026-12-31',emoji:'✨',repeat:'yearly'}];
const $=id=>document.getElementById(id);
let events;
try{const stored=JSON.parse(localStorage.getItem(KEY));events=Array.isArray(stored)?stored:defaults.slice()}catch(e){events=defaults.slice()}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function days(e){const parts=String(e.date||'').split('-').map(Number);if(parts.length!==3||parts.some(n=>!Number.isFinite(n)))return null;const now=today();let d=new Date(parts[0],parts[1]-1,parts[2]);if(e.repeat==='yearly'){d=new Date(now.getFullYear(),parts[1]-1,parts[2]);if(d<now)d=new Date(now.getFullYear()+1,parts[1]-1,parts[2])}return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(events));return true}catch(e){$('feedback').textContent='Speichern im Browser blockiert. Die Änderung ist nur bis zum Neuladen sichtbar.';return false}}
function render(){const upcoming=events.map(e=>({...e,left:days(e)})).filter(e=>e.left!==null&&e.left>=0).sort((a,b)=>a.left-b.left);$('entries').replaceChildren();if(!upcoming.length){const x=document.createElement('div');x.className='muted';x.textContent='Keine kommenden Ereignisse. Tippe auf Bearbeiten.';$('entries').append(x)}for(const e of upcoming){const row=document.createElement('div');row.className='entry';for(const [cls,txt] of [['emoji',e.emoji||'🎉'],['name',e.name],['days',String(e.left)]]){const x=document.createElement('span');x.className=cls;x.textContent=txt;row.append(x)}$('entries').append(row)}$('hint').textContent='';$('manage').replaceChildren();for(const e of events){const row=document.createElement('div');row.className='manage-row';const label=document.createElement('span');label.textContent=`${e.emoji||'🎉'} ${e.name} · ${e.date}${e.repeat==='yearly'?' · jährlich':''}`;const buttons=document.createElement('span');const edit=document.createElement('button');edit.type='button';edit.textContent='Ändern';edit.onclick=()=>{$('name').value=e.name;$('date').value=e.date;$('repeat').value=e.repeat;const known=[...$('emoji').options].some(o=>o.value===e.emoji);$('emoji').value=known?e.emoji:'custom';$('customEmoji').value=known?'':e.emoji;syncEmoji();events=events.filter(x=>x.id!==e.id);save();render();$('name').focus()};const del=document.createElement('button');del.type='button';del.textContent='Löschen';del.onclick=()=>{events=events.filter(x=>x.id!==e.id);save();render()};buttons.append(edit,del);row.append(label,buttons);$('manage').append(row)}}
function syncEmoji(){$('customEmojiLabel').hidden=$('emoji').value!=='custom'}
$('emoji').addEventListener('change',syncEmoji);
$('toggle').addEventListener('click',()=>{const open=$('editor').hidden;$('editor').hidden=!open;$('toggle').textContent=open?'Fertig':'✎ Bearbeiten'});
$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),date=$('date').value;if(!name||!date){$('feedback').textContent='Bitte Ereignis und Datum ausfüllen.';return}const emoji=($('emoji').value==='custom'?$('customEmoji').value.trim():$('emoji').value)||'🎉';events.push({id:String(Date.now())+Math.random(),name,date,emoji,repeat:$('repeat').value});const saved=save();$('form').reset();syncEmoji();render();if(saved)$('feedback').textContent='✓ Ereignis hinzugefügt und gespeichert.'});
syncEmoji();render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
