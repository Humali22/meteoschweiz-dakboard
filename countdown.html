<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Familien-Countdown</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:transparent;padding:5px}
    .panel{background:#263740;border:1px solid #536975;border-radius:15px;overflow:hidden;max-width:800px;margin:0 auto}
    .header{background:#263740;padding:13px 15px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:22px;margin:0;font-weight:750;letter-spacing:.1px}
    button{font:inherit;touch-action:manipulation;cursor:pointer}
    .edit,.action,.small-button{border-radius:9px;color:#fff;border:1px solid #7095a5;padding:8px 11px;background:#415b69;font-size:14px}
    .edit{white-space:nowrap}
    .entries{padding:5px 13px 7px}
    .entry{display:grid;grid-template-columns:45px minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid #455b68;min-height:67px}
    .entry:last-child{border:0}
    .emoji{font-size:36px}.name{font-size:25px;line-height:1.25;font-weight:600;overflow-wrap:anywhere;color:#fffaf3}.days{font-size:31px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:#a8e1f7}
    .muted{color:#c0d0d4;font-size:12px;padding:7px 14px}
    .feedback{color:#a8e1f7;font-size:13px;min-height:0;white-space:normal}
    .feedback:empty{display:none}
    .modal{padding:13px;background:#334b59;border-top:1px solid #536975}
    form{display:grid;grid-template-columns:minmax(120px,2fr) minmax(130px,1fr) minmax(130px,1fr) minmax(95px,1fr) auto;gap:8px;align-items:end}
    label{font-size:13px;color:#d4e3eb;display:flex;flex-direction:column;gap:5px}
    input,select{width:100%;border:1px solid #7095a5;border-radius:7px;background:#f5f8fa;color:#263740;min-height:42px;padding:8px;font-size:15px;color-scheme:light}
    .action{min-height:42px;background:#476f83;font-size:15px;font-weight:750}
    .action:focus-visible,.edit:focus-visible,.small-button:focus-visible{outline:3px solid #a8e1f7;outline-offset:2px}
    .manage{margin-top:10px;max-height:220px;overflow:auto}
    .manage-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #536975;padding:8px 0;font-size:14px}
    .manage-row .buttons{display:flex;gap:5px}
    .small-button{padding:6px 8px;white-space:nowrap}
    .version{opacity:.7;font-size:10px;float:right}
    [hidden]{display:none!important}
    @media(max-width:690px){form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.action{grid-column:1/-1}.manage-row{flex-wrap:wrap}.name{font-size:22px}.days{font-size:27px}.emoji{font-size:32px}.entry{grid-template-columns:40px minmax(0,1fr) auto;gap:8px}h1{font-size:20px}}
  </style>
</head>
<body>
<section class="panel" aria-label="Familien-Countdown">
  <header class="header">
    <h1>Countdown</h1>
    <button id="toggle" class="edit" type="button">✎ Bearbeiten</button>
  </header>
  <div class="entries" id="entries"></div>
  <div class="muted" id="hint">Tage bis zum Ereignis</div>
  <div class="muted feedback" role="status" aria-live="polite" id="feedback"></div>
  <section id="editor" class="modal" hidden>
    <form id="form" novalidate>
      <label class="wide">Ereignis<input id="name" maxlength="60" placeholder="z. B. Sommerferien"></label>
      <label>Datum<input type="date" id="date" aria-label="Datum auswählen"></label>
      <label>Symbol<select id="emoji">
        <option value="🐰">🐰 Osterhase</option>
        <option value="🎂">🎂 Geburtstagstorte</option>
        <option value="🎹">🎹 Klaviertastatur</option>
        <option value="🎻">🎻 Cello / Streichinstrument</option>
        <option value="🌷">🌷 Tulpe</option>
        <option value="🏖️">🏖️ Strand</option>
        <option value="✈️">✈️ Flugzeug</option>
        <option value="🎄">🎄 Weihnachten</option>
        <option value="🎅">🎅 Samichlaus</option>
        <option value="🚗">🚗 Auto</option>
        <option value="🧳">🧳 Koffer</option>
        <option value="📚">📚 Bücher</option>
        <option value="✨">✨ Silvester</option>
        <option value="🍂">🍂 Herbstlaub</option>
        <option value="🍁">🍁 Herbstblatt</option>
        <option value="🍂🍁">🍂🍁 Herbstferien</option>
        <option value="⛷️">⛷️ Skiferien</option>
        <option value="🎉" selected>🎉 Feiern</option>
        <option value="custom">✏️ Eigenes Emoji …</option>
      </select></label>
      <label id="customEmojiLabel" hidden>Eigenes Symbol<input id="customEmoji" maxlength="12" placeholder="Emoji"></label>
      <label>Wiederholen<select id="repeat"><option value="once">Einmalig</option><option value="yearly">Jährlich</option></select></label>
      <button id="add" class="action" type="button">Hinzufügen</button>
    </form>
    <div id="manage" class="manage"></div>
    <div class="muted">Änderungen werden nur in diesem Browser gespeichert. <span class="version">Version 3.1 · Dunkel</span></div>
  </section>
</section>
<script>
(function(){
  'use strict';
  // This key preserves events entered in previous versions of the Countdown.
  const KEY='familien-countdown-v1';
  const DEFAULTS=[
    {id:'xmas',name:'Weihnachten',date:'2026-12-24',emoji:'🎄',repeat:'yearly'},
    {id:'ny',name:'Silvester',date:'2026-12-31',emoji:'✨',repeat:'yearly'}
  ];
  const el=id=>document.getElementById(id);
  let events=[];
  let editingId=null;
  let storageAvailable=true;
  try {
    const stored=JSON.parse(localStorage.getItem(KEY));
    events=Array.isArray(stored) ? stored : DEFAULTS.slice();
  } catch(err) {
    storageAvailable=false;
    events=DEFAULTS.slice();
  }
  function message(text){el('feedback').textContent=text}
  function validDate(date){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;
    const [y,m,d]=date.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
  }
  function dayNumber(y,m,d){return Date.UTC(y,m-1,d)/86400000}
  function daysLeft(event){
    if(!validDate(String(event.date||'')))return null;
    const [y,m,d]=event.date.split('-').map(Number);
    const today=new Date();
    const todayN=dayNumber(today.getFullYear(),today.getMonth()+1,today.getDate());
    if(event.repeat==='yearly'){
      let year=today.getFullYear();
      let target=dayNumber(year,m,d);
      if(target<todayN){year+=1;target=dayNumber(year,m,d)}
      return Math.round(target-todayN);
    }
    return Math.round(dayNumber(y,m,d)-todayN);
  }
  function save(){
    try {
      localStorage.setItem(KEY,JSON.stringify(events));
      storageAvailable=true;
      return true;
    } catch(err) {
      storageAvailable=false;
      return false;
    }
  }
  function syncEmoji(){el('customEmojiLabel').hidden=el('emoji').value!=='custom'}
  function resetForm(){
    editingId=null;
    el('form').reset();
    el('emoji').value='🎉';
    el('customEmoji').value='';
    el('add').textContent='Hinzufügen';
    syncEmoji();
  }
  function render(){
    const entries=el('entries');
    const management=el('manage');
    entries.replaceChildren();
    management.replaceChildren();
    const upcoming=events.map(event=>({event,left:daysLeft(event)}))
      .filter(item=>item.left!==null&&item.left>=0)
      .sort((a,b)=>a.left-b.left);
    if(!upcoming.length){
      const empty=document.createElement('div');
      empty.className='muted';
      empty.textContent='Keine kommenden Ereignisse. Tippe auf Bearbeiten.';
      entries.appendChild(empty);
    }
    for(const {event,left} of upcoming){
      const row=document.createElement('div');
      row.className='entry';
      for(const [className,value] of [
        ['emoji',event.emoji||'🎉'],['name',event.name||'Ereignis'],['days',String(left)]
      ]){
        const span=document.createElement('span');
        span.className=className;
        span.textContent=value;
        row.appendChild(span);
      }
      entries.appendChild(row);
    }
    el('hint').textContent='Tage bis zum Ereignis · jährlich wiederkehrende Termine zählen automatisch neu';
    for(const event of events){
      const row=document.createElement('div');row.className='manage-row';
      const label=document.createElement('span');
      label.textContent=(event.emoji||'🎉')+' '+(event.name||'Ereignis')+' · '+event.date+(event.repeat==='yearly'?' · jährlich':'');
      const buttons=document.createElement('div');buttons.className='buttons';
      const edit=document.createElement('button');edit.type='button';edit.className='small-button';edit.textContent='Ändern';
      edit.addEventListener('click',()=>{
        editingId=event.id;
        el('name').value=event.name||'';
        el('date').value=validDate(String(event.date||''))?event.date:'';
        el('repeat').value=event.repeat==='yearly'?'yearly':'once';
        const exists=[...el('emoji').options].some(option=>option.value===event.emoji);
        el('emoji').value=exists?event.emoji:'custom';
        el('customEmoji').value=exists?'':(event.emoji||'');
        syncEmoji();
        el('add').textContent='Änderung speichern';
        message('Ereignis bearbeiten, dann auf «Änderung speichern» tippen.');
        el('name').focus();
      });
      const del=document.createElement('button');del.type='button';del.className='small-button';del.textContent='Löschen';
      del.addEventListener('click',()=>{
        events=events.filter(item=>item.id!==event.id);
        if(editingId===event.id)resetForm();
        const saved=save();render();
        message(saved?'Ereignis gelöscht.':'Ereignis gelöscht, aber dauerhafte Speicherung ist hier blockiert.');
      });
      buttons.append(edit,del);row.append(label,buttons);management.appendChild(row);
    }
  }
  function addEvent(){
    // Explicit button handler: browser's native form validation cannot swallow the click.
    try{
      const name=el('name').value.trim();
      const date=el('date').value.trim();
      if(!name){message('Bitte zuerst einen Namen für das Ereignis eingeben.');el('name').focus();return}
      if(!validDate(date)){message('Bitte ein gültiges Datum auswählen (Tag, Monat und Jahr).');el('date').focus();return}
      const custom=el('emoji').value==='custom';
      const emoji=(custom?el('customEmoji').value.trim():el('emoji').value)||'🎉';
      const item={id:editingId||('event-'+Date.now()+'-'+Math.floor(Math.random()*100000)),name,date,emoji,
        repeat:el('repeat').value==='yearly'?'yearly':'once'};
      if(editingId){events=events.map(event=>event.id===editingId?item:event)}
      else events.push(item);
      const saved=save();
      render();
      resetForm();
      message(saved?'✓ Ereignis hinzugefügt und gespeichert.':'✓ Ereignis hinzugefügt. Hinweis: dauerhafte Speicherung ist in diesem Browser blockiert.');
    }catch(err){message('Fehler beim Hinzufügen: '+(err&&err.message?err.message:String(err)))}
  }
  el('toggle').addEventListener('click',()=>{
    const opening=el('editor').hidden;
    el('editor').hidden=!opening;
    el('toggle').textContent=opening?'Fertig':'✎ Bearbeiten';
    if(opening&&!storageAvailable)message('Hinweis: Dieser Browser verhindert dauerhafte lokale Speicherung.');
  });
  el('emoji').addEventListener('change',syncEmoji);
  el('form').addEventListener('submit',event=>{event.preventDefault();addEvent()});
  el('add').addEventListener('click',addEvent);
  syncEmoji();
  render();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
})();
</script>
</body>
</html>
