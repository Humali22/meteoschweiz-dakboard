<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familien-Countdown</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#fff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;padding:5px}.panel{background:#211917;border:1px solid #654236;border-radius:12px;overflow:hidden;max-width:750px;margin:auto;box-shadow:0 4px 12px #0003}.header{background:linear-gradient(#974122,#6e2e19);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{margin:0;font-size:17px;font-weight:750}.edit{color:#fff;background:#ffffff19;border:1px solid #ffffff55;border-radius:8px;min-height:31px;padding:4px 9px;font-size:13px;cursor:pointer}.entries{padding:4px 8px 8px}.entry{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 6px;border-bottom:1px solid #684636;min-height:43px}.entry:last-child{border-bottom:0}.emoji{font-size:19px;text-align:center}.name{font-size:15px;overflow-wrap:anywhere}.days{font-size:17px;min-width:33px;text-align:right;font-weight:750;font-variant-numeric:tabular-nums}.empty{font-size:14px;color:#e0c7b9;padding:15px}.muted{color:#e0c7b9;font-size:12px;padding:0 12px 9px}.modal[hidden]{display:none}.modal{background:#35251f;border-top:1px solid #805743;padding:12px}form{display:grid;grid-template-columns:1fr 125px 108px 110px auto;gap:7px;align-items:end}label{font-size:12px;color:#ead6cb;display:flex;flex-direction:column;gap:4px}input,select{width:100%;border-radius:7px;border:1px solid #a77b63;background:#fff;color:#222;padding:8px;font-size:14px;min-height:36px}button.action{background:#a84e2e;color:white;border:0;border-radius:7px;padding:8px 12px;min-height:36px;font-weight:700;cursor:pointer}.manage{margin-top:10px;max-height:230px;overflow:auto}.manage-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #604033;font-size:13px}.manage-row button{background:#573229;border:1px solid #9d7663;color:white;border-radius:6px;padding:6px 8px;cursor:pointer}@media(max-width:650px){form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.entry{padding:7px 5px}.name{font-size:14px}}
</style></head><body><section class="panel"><header class="header"><h1>📅 Noch so viele Tage …</h1><button id="toggle" class="edit" type="button" aria-expanded="false">✎ Bearbeiten</button></header><div class="entries" id="entries"></div><div id="hint" class="muted"></div><section id="editor" class="modal" hidden><form id="form"><label class="wide">Ereignis<input id="name" maxlength="60" required placeholder="z. B. Sommerferien"></label><label>Datum<input id="date" type="date" required></label><label>Symbol<input id="emoji" value="🎉" maxlength="4" aria-label="Emoji"></label><label>Wiederholen<select id="repeat"><option value="once">Einmalig</option><option value="yearly">Jährlich</option></select></label><button class="action" type="submit">Hinzufügen</button></form><div class="manage" id="manage"></div></section></section>
<script>
'use strict';
const KEY='familien-countdown-v1';
const defaults=[{id:'xmas',name:'Weihnachten',date:'2026-12-24',emoji:'🎄',repeat:'yearly'},{id:'ny',name:'Silvester',date:'2026-12-31',emoji:'✨',repeat:'yearly'}];
let events;try{const value=JSON.parse(localStorage.getItem(KEY));events=Array.isArray(value)?value:defaults}catch{events=defaults}
const $=id=>document.getElementById(id);
function today(){const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function target(e){const parts=(e.date||'').split('-').map(Number);if(parts.length!==3||parts.some(n=>!Number.isFinite(n)))return null;let d=new Date(parts[0],parts[1]-1,parts[2]);if(e.repeat==='yearly'){const now=today();d=new Date(now.getFullYear(),parts[1]-1,parts[2]);if(d<now)d=new Date(now.getFullYear()+1,parts[1]-1,parts[2])}return d}
function days(e){const d=target(e);return d?Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(today().getFullYear(),today().getMonth(),today().getDate()))/86400000):null}
function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function render(){const list=events.map(e=>({...e,left:days(e)})).filter(e=>e.left!==null&&e.left>=0).sort((a,b)=>a.left-b.left);$('entries').replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Noch keine kommenden Ereignisse. Tippe auf «Bearbeiten».';$('entries').append(empty)}else{for(const e of list){const row=document.createElement('div');row.className='entry';for(const [className,text] of [['emoji',e.emoji||'🎉'],['name',e.name],['days',String(e.left)]]){const x=document.createElement('span');x.className=className;x.textContent=text;row.append(x)}$('entries').append(row)}}$('hint').textContent='Tage bis zum Ereignis · jährliche Termine zählen automatisch neu';$('manage').replaceChildren();for(const e of events){const row=document.createElement('div');row.className='manage-row';const desc=document.createElement('span');desc.textContent=`${e.emoji||'🎉'} ${e.name} · ${e.date}${e.repeat==='yearly'?' · jährlich':''}`;const edit=document.createElement('button');edit.textContent='Ändern';edit.type='button';edit.onclick=()=>{events=events.filter(item=>item.id!==e.id);$('name').value=e.name;$('date').value=e.date;$('emoji').value=e.emoji;$('repeat').value=e.repeat;save();render();$('name').focus()};const del=document.createElement('button');del.textContent='Löschen';del.type='button';del.onclick=()=>{events=events.filter(item=>item.id!==e.id);save();render()};const controls=document.createElement('span');controls.style.display='flex';controls.style.gap='4px';controls.append(edit,del);row.append(desc,controls);$('manage').append(row)}}
$('toggle').onclick=()=>{const open=$('editor').hidden;$('editor').hidden=!open;$('toggle').setAttribute('aria-expanded',String(open));$('toggle').textContent=open?'Fertig':'✎ Bearbeiten'};
$('form').onsubmit=e=>{e.preventDefault();events.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:$('name').value.trim(),date:$('date').value,emoji:$('emoji').value||'🎉',repeat:$('repeat').value});save();$('form').reset();$('emoji').value='🎉';render()};
render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
